<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Patatram Rehabilitation Center</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Patatram Rehabilitation Center provides advanced neurological and physical rehabilitation care with expert support and modern treatment facilities."
    />

    <meta
      name="keywords"
      content="rehabilitation center, neurological rehabilitation, physical therapy, healthcare, recovery center, Patatram"
    />

    <meta name="author" content="Patatram Rehabilitation Center" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/bg.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.patatram.org/" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Patatram Rehabilitation Center" />

    <meta
      property="og:description"
      content="Advanced neurological and physical rehabilitation care."
    />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://www.patatram.org/" />

    <meta property="og:image" content="https://www.patatram.org/bg.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Patatram Rehabilitation Center"
    />

    <meta
      name="twitter:description"
      content="Advanced neurological and physical rehabilitation care."
    />

    <meta
      name="twitter:image"
      content="https://www.patatram.org/bg.png"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
